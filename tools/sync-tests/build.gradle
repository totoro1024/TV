plugins { id 'java' }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
sourceSets {
    main.java {
        srcDir '../../app/src/main/java'
        srcDir '../../app/src/playerCompat/java'
        include 'androidx/media3/exoplayer/libass/LibassFontFile.java'
        include 'com/fongmi/android/tv/sync/SyncDocument.java'
        include 'com/fongmi/android/tv/sync/CloudConfig.java'
        include 'com/fongmi/android/tv/sync/SyncReplica.java'
        include 'com/fongmi/android/tv/sync/SyncEngine.java'
        include 'com/fongmi/android/tv/sync/WebDavClient.java'
    }
    test.java { srcDir '../../app/src/test/java'; include 'com/fongmi/android/tv/sync/**' }
}
dependencies { implementation libs.gson; implementation libs.okhttp; testImplementation libs.junit; testImplementation libs.nanohttpd; testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.0.3'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3' }
test { useJUnitPlatform() }
